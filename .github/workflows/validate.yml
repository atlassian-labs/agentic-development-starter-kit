name: Validate starter kit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check required files
        shell: bash
        run: |
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f OWNERS.md
          test -f MANIFEST.md
          test -f EXTERNAL_SHARE_CHECKLIST.md
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run scorer, workflow and public-link tests
        shell: bash
        run: node --test examples/jira-ai-readiness/test/*.test.js scripts/test-*.js
      - name: Run persisted-data contract example
        shell: bash
        run: python3 -m unittest discover -s examples/activity-snapshot-contract -v
      - name: Check for private/internal references
        shell: bash
        run: |
          ! grep -RInE 'internal\.example\.com|private\.example\.com|source-project-name|private-company-name' . --exclude='validate.yml'
